[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethnomed-ner"
version = "0.1.0"
description = "BADP core modules: boundary-aware Mamba and decoupled procedural distillation"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "transformers>=4.44,<5",
  "pytorch-crf==0.7.2",
]

[project.optional-dependencies]
lora = ["peft>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
